<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="鸣潮粉丝俱乐部 —— 版本资讯、版本日历、声骸图鉴、配队模拟与悲鸣社区，单文件零依赖前端演示。">
<title>鸣潮粉丝俱乐部</title>
<!-- 说明：不引入 favicon / theme-color 等需要裸色值的资源，全部色值仅在 <style> 的 :root 令牌中定义 -->
<style>
/* ==========================================================================
   鸣潮粉丝俱乐部 · 单文件演示站
   结构：01 TOKENS / 02 BASE / 03 LAYOUT / 04 COMPONENTS / 05 VIEWS
        06 OVERLAY(模态·Toast) / 07 RESPONSIVE / 08 A11Y
   约定：所有色值 · 间距 · 圆角 · 动效参数均由 :root 令牌提供，
        组件内不出现裸值（媒体查询断点无法使用 var()，以 --bp-* 记录）。
   ========================================================================== */

/* ---------------------------------------------------------------- 01 TOKENS */
:root{
  /* 表面层级 */
  --surface-abyss:#05080d;
  --surface-sunken:#0a1017;
  --surface-base:#0f1823;
  --surface-raised:#16212e;
  --surface-overlay:#1c2a39;

  /* 描边 */
  --stroke-subtle:rgba(120,180,200,.08);
  --stroke-base:rgba(120,180,200,.14);
  --stroke-strong:rgba(120,180,200,.24);
  --stroke-accent:rgba(79,209,197,.45);

  /* 文本 */
  --text-high:#eaf2f8;
  --text-body:#b8c7d6;
  --text-muted:#7d92a6;
  --text-faint:#55697c;

  /* 强调色 */
  --resonance:#4fd1c5;
  --resonance-glow:rgba(79,209,197,.18);
  --sonic:#6ea8fe;
  --sonic-glow:rgba(110,168,254,.10);
  --tide-gold:#e5c07b;
  --wail-red:#e06c75;
  --wail-glow:rgba(224,108,117,.18);

  /* 元素色 */
  --elem-diffraction:#dcc178; --elem-aero:#5ad8cc; --elem-havoc:#b47ae0;
  --elem-glacio:#74a8e8;      --elem-fusion:#e0767e; --elem-electro:#9b8ae0;

  /* 间距 */
  --sp-0h:2px; --sp-1:4px; --sp-1h:6px; --sp-2:8px; --sp-2h:10px;
  --sp-3:12px; --sp-3h:14px; --sp-4:16px; --sp-4h:20px; --sp-5:24px;
  --sp-5h:28px; --sp-6:32px; --sp-6h:40px; --sp-7:48px; --sp-8:64px;

  /* 圆角 */
  --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;

  /* 动效 */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:160ms; --dur-base:240ms; --dur-slow:420ms;
  --tr-fast:var(--dur-fast) var(--ease-out);
  --tr-base:var(--dur-base) var(--ease-out);
  --tr-slow:var(--dur-slow) var(--ease-out);

  /* 阴影 */
  --elev-1:0 1px 0 rgba(255,255,255,.03), 0 4px 16px rgba(0,0,0,.35);
  --elev-2:0 1px 0 rgba(255,255,255,.05), 0 12px 34px rgba(0,0,0,.5);
  --glow-resonance:0 0 0 1px var(--stroke-accent), 0 0 28px -6px var(--resonance);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.04);

  /* 字体 */
  --font-sans:"PingFang SC","HarmonyOS Sans","Microsoft YaHei",system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono","Cascadia Code",monospace;

  /* 字阶 */
  --fs-display:clamp(32px,5vw,48px);
  --fs-h1:26px; --fs-h2:19px; --fs-h3:16px;
  --fs-body:14.5px; --fs-caption:12.5px; --fs-micro:11px;
  --fs-sm:13px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:30px;
  --lh-tight:1.25; --lh-base:1.65;
  --ls-caps:.08em; --ls-tight:-.01em;

  /* 结构尺度 */
  --content:1180px; --content-narrow:840px; --max-prose:66ch;
  --nav-h:62px; --bw-1:1px; --bw-2:2px; --bw-3:3px;
  --avatar:46px; --avatar-lg:64px; --avatar-sm:32px;
  --bar-h:8px; --dot:6px; --cell-h:68px; --icon:18px; --icon-lg:22px;
  --btn-py:9px; --btn-px:16px; --btn-sm-py:6px; --btn-sm-px:13px;
  --brand-mark:34px; --icon-mark:22px;
  --card-min:260px; --card-min-wide:320px; --metric-min:160px; --stat-min:140px;
  --detail-min:120px; --slot-min:190px; --search-min:220px; --profile-min:200px;
  --modal-w:560px; --modal-w-md:640px; --modal-w-wide:880px; --modal-h:760px;
  --toast-max:420px;

  /* 叠层 */
  --z-grid:0; --z-content:1; --z-nav:40; --z-modal:80; --z-toast:90;

  /* 品牌签名：深海声呐网格 */
  --grid-size:56px;
  --grid-line:rgba(120,180,200,.05);
  --grid-opacity:.5;
  --mask-solid:#000;

  /* 品牌签名：声波频谱 */
  --wave-h:96px; --wave-gap:3px; --wave-dur:1.6s; --wave-delay:60ms; --wave-op:.85;
  --wave-from:rgba(79,209,197,0); --wave-to:var(--resonance);
  --bars:40;

  /* 品牌签名：共鸣环 */
  --ring-spread:12px; --ring-transparent:rgba(79,209,197,0);

  /* 组件杂项 */
  --nav-bg:rgba(5,8,13,.72); --blur:14px; --scrim:rgba(2,5,9,.72);
  --ink-invert:#052a26;
  --track:rgba(120,180,200,.10);
  --disabled-op:.45;
  --focus-ring:0 0 0 3px var(--resonance-glow);
  --focus-ring-error:0 0 0 3px var(--wail-glow);
  --grad-primary:linear-gradient(135deg,var(--resonance),var(--sonic));
  --grad-bar:linear-gradient(90deg,var(--resonance),var(--sonic));
  --skel:linear-gradient(90deg,var(--surface-base),var(--surface-raised),var(--surface-base));
  --shimmer-dur:1.4s; --shimmer-w:200%;
  --toast-dur:2600ms; --skeleton-ms:620ms;
  --ambient:radial-gradient(900px 520px at 78% -12%,var(--resonance-glow),transparent 68%),
            radial-gradient(760px 520px at 6% 2%,var(--sonic-glow),transparent 70%);
  --glow-top:radial-gradient(120% 100% at 50% 0,var(--resonance-glow),transparent 62%);

  /* 视觉增强层：玻璃质感 / 光斑 / 纹理 / 角标 / 入场 */
  --sheen:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.075) 47%,transparent 60%);
  --sheen-w:220%;
  --hairline:linear-gradient(90deg,transparent,var(--stroke-strong) 20%,var(--stroke-strong) 80%,transparent);
  --hairline-v:linear-gradient(180deg,transparent,var(--stroke-strong),transparent);
  --hairline-accent:linear-gradient(90deg,transparent,var(--stroke-accent) 18%,var(--resonance) 50%,var(--stroke-accent) 82%,transparent);
  --aura-element:radial-gradient(78% 92% at 50% 106%,var(--el,var(--resonance)),transparent 68%);
  --orb-1:radial-gradient(circle at 34% 32%,var(--resonance),transparent 62%);
  --orb-2:radial-gradient(circle at 62% 38%,var(--sonic),transparent 62%);
  --orb-size:420px; --orb-blur:78px; --orb-op:.34; --orb-dur:9s; --orb-travel:-26px;
  --rings-w:640px; --ring-dur:7s;
  --rune-size:86px; --spin-dur:26s;
  --corner-size:15px; --corner-w:1.5px;
  --enter-y:14px; --enter-dur:520ms; --enter-step:60ms; --enter-cap:10;
  --dot-dur:2.4s;
  --halo-soft:0 0 26px -8px var(--resonance);
  --elev-3:0 1px 0 rgba(255,255,255,.06), 0 22px 60px rgba(0,0,0,.62);
  --score-grad:linear-gradient(135deg,var(--text-high) 30%,var(--resonance));
  --radar-max:300px; --radar-fs:10px; --badge-min:118px;
  --tick:rgba(120,180,200,.20);

  /* 断点记录（媒体查询无法引用 var()，此处仅作文档化令牌） */
  --bp-lg:980px; --bp-md:900px; --bp-sm:680px; --bp-xs:460px;
}

/* ------------------------------------------------------------------ 02 BASE */
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  overflow-x:clip;
}
body{
  margin:0;
  min-height:100dvh;
  overflow-x:clip;
  background:var(--surface-abyss);
  color:var(--text-body);
  font-family:var(--font-sans);
  font-size:var(--fs-body);
  line-height:var(--lh-base);
  font-variant-numeric:tabular-nums; /* 数值型文本全局等宽对齐 */
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* 品牌签名 03：深海声呐网格（固定定位 + 径向遮罩向边缘淡出） */
body::before{
  content:"";position:fixed;inset:0;z-index:var(--z-grid);pointer-events:none;
  background:var(--ambient);
}
body::after{
  content:"";position:fixed;inset:0;z-index:var(--z-grid);pointer-events:none;
  opacity:var(--grid-opacity);
  background-image:
    linear-gradient(var(--grid-line) var(--bw-1),transparent var(--bw-1)),
    linear-gradient(90deg,var(--grid-line) var(--bw-1),transparent var(--bw-1));
  background-size:var(--grid-size) var(--grid-size);
  -webkit-mask-image:radial-gradient(118% 88% at 50% 38%,var(--mask-solid) 18%,transparent 76%);
  mask-image:radial-gradient(118% 88% at 50% 38%,var(--mask-solid) 18%,transparent 76%);
}
h1,h2,h3,h4,p,dl,dd,dt,figure{margin:0}
h1,h2,h3{color:var(--text-high);line-height:var(--lh-tight);letter-spacing:var(--ls-tight)}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.icon{width:var(--icon);height:var(--icon);flex:0 0 auto}
.icon--lg{width:var(--icon-lg);height:var(--icon-lg)}
.num,time,output{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:0}
::selection{background:var(--stroke-accent);color:var(--text-high)}
:focus-visible{outline:var(--bw-2) solid var(--resonance);outline-offset:var(--bw-2)}
:where(a,button,input,textarea,[tabindex]):focus:not(:focus-visible){outline:none}
.skip-link{
  position:fixed;top:var(--sp-2);left:var(--sp-2);z-index:var(--z-toast);
  transform:translateY(calc(-1 * var(--sp-8)));
  padding:var(--sp-2) var(--sp-4);border-radius:var(--r-pill);
  background:var(--surface-overlay);border:var(--bw-1) solid var(--stroke-accent);
  color:var(--text-high);transition:transform var(--tr-fast);
}
.skip-link:focus{transform:translateY(0)}
[hidden]{display:none !important}
noscript{display:block;padding:var(--sp-5);text-align:center;color:var(--text-muted)}

/* ---------------------------------------------------------------- 03 LAYOUT */
.nav{
  position:sticky;top:0;z-index:var(--z-nav);
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border-bottom:var(--bw-1) solid var(--stroke-subtle);
}
.nav__inner{
  position:relative;
  max-width:var(--content);margin:0 auto;min-height:var(--nav-h);
  padding:0 var(--sp-4);
  display:flex;align-items:center;gap:var(--sp-4);
}
.brand{display:flex;align-items:center;gap:var(--sp-2h);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-1h)}
.brand__mark{
  width:var(--brand-mark);height:var(--brand-mark);flex:0 0 auto;display:grid;place-items:center;
  border-radius:var(--r-md);background:var(--surface-base);
  border:var(--bw-1) solid var(--stroke-base);box-shadow:var(--shadow-inset);
}
.brand__mark svg{width:var(--icon-mark);height:var(--icon-mark)}
.brand__text{display:flex;flex-direction:column;line-height:1.15;color:var(--text-high);font-size:var(--fs-h3);font-weight:600}
.brand__text small{font-size:var(--fs-micro);font-weight:500;color:var(--text-muted);letter-spacing:var(--ls-caps)}
.nav__links{display:flex;align-items:center;gap:var(--sp-0h);margin-inline-start:auto}
.nav__links a{
  padding:var(--sp-1h) var(--sp-3);border-radius:var(--r-pill);
  font-size:var(--fs-sm);color:var(--text-muted);
  border:var(--bw-1) solid transparent;
  transition:color var(--tr-fast),background var(--tr-fast),border-color var(--tr-fast);
}
.nav__links a:hover{color:var(--text-high);background:var(--surface-raised);border-color:var(--stroke-base)}
.nav__links a:active{transform:scale(.97)}
.nav__links a[aria-current="page"]{
  color:var(--resonance);background:var(--resonance-glow);border-color:var(--stroke-accent);
}
.nav__actions{display:flex;align-items:center;gap:var(--sp-2)}
.nav__burger{display:none}
main#app{position:relative;z-index:var(--z-content);display:block}
.wrap{max-width:var(--content);margin:0 auto;padding:var(--sp-6) var(--sp-4) var(--sp-8)}
.section{margin-top:var(--sp-7)}
.section__head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap}
.section__title{font-size:var(--fs-h2);display:flex;align-items:center;gap:var(--sp-2)}
.section__title::before{content:"";width:var(--bw-3);height:var(--fs-h2);border-radius:var(--r-pill);background:var(--grad-bar)}
.section__desc{color:var(--text-muted);font-size:var(--fs-caption)}
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);
  flex-wrap:wrap;margin-bottom:var(--sp-5);
}
.page-head__title{font-size:var(--fs-h1)}
.page-head__desc{color:var(--text-muted);font-size:var(--fs-caption);max-width:var(--max-prose);margin-top:var(--sp-1)}
.page-head__actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.grid{display:grid;gap:var(--sp-4);grid-template-columns:repeat(auto-fill,minmax(min(var(--card-min),100%),1fr))}
.grid--wide{grid-template-columns:repeat(auto-fill,minmax(min(var(--card-min-wide),100%),1fr))}
.split{display:grid;gap:var(--sp-5);grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.split--even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.stack *,.split *,.grid *{min-width:0}
.prose{max-width:var(--max-prose)}
.muted{color:var(--text-muted)}
.mt-3{margin-top:var(--sp-3)} .mt-4{margin-top:var(--sp-4)} .mt-5{margin-top:var(--sp-5)}
.visually-hidden{position:absolute;width:var(--bw-1);height:var(--bw-1);margin:calc(-1 * var(--bw-1));padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ------------------------------------------------------------ 04 COMPONENTS */

/* 按钮：默认 / hover / focus-visible / active / disabled */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1h);
  padding:var(--btn-py) var(--btn-px);
  border-radius:var(--r-pill);
  border:var(--bw-1) solid var(--stroke-base);
  background:var(--surface-base);color:var(--text-body);
  font-size:var(--fs-body);line-height:1.2;cursor:pointer;
  white-space:nowrap;
  transition:color var(--tr-fast),border-color var(--tr-fast),background var(--tr-fast),
             box-shadow var(--tr-base),transform var(--dur-fast) var(--ease-out);
}
.btn:hover{color:var(--resonance);border-color:var(--stroke-accent);background:var(--surface-raised)}
.btn:focus-visible{outline:var(--bw-2) solid var(--resonance);outline-offset:var(--bw-2)}
.btn:active{transform:scale(.97)}
.btn:disabled,.btn[aria-disabled="true"]{
  opacity:var(--disabled-op);cursor:not-allowed;
  color:var(--text-muted);border-color:var(--stroke-subtle);background:var(--surface-sunken);
  transform:none;box-shadow:none;
}
.btn-primary{
  background:var(--grad-primary);border-color:transparent;color:var(--ink-invert);font-weight:600;
  box-shadow:var(--shadow-inset);
}
.btn-primary:hover{background:var(--grad-primary);color:var(--ink-invert);border-color:transparent;filter:saturate(1.12) brightness(1.06)}
.btn-primary:disabled{background:var(--surface-sunken);color:var(--text-muted);filter:none}
.btn-danger:hover{color:var(--wail-red);border-color:var(--wail-red);background:var(--surface-raised)}
.btn-sm{padding:var(--btn-sm-py) var(--btn-sm-px);font-size:var(--fs-sm)}
.icon-btn{
  display:inline-grid;place-items:center;
  width:calc(var(--icon) + var(--sp-3h));height:calc(var(--icon) + var(--sp-3h));
  border-radius:var(--r-sm);border:var(--bw-1) solid var(--stroke-base);
  background:var(--surface-base);color:var(--text-muted);cursor:pointer;
  transition:color var(--tr-fast),border-color var(--tr-fast),background var(--tr-fast),transform var(--dur-fast) var(--ease-out);
}
.icon-btn:hover{color:var(--resonance);border-color:var(--stroke-accent);background:var(--surface-raised)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:var(--disabled-op);cursor:not-allowed}
.icon-btn.is-on{color:var(--tide-gold);border-color:var(--tide-gold);background:var(--surface-raised)}
.icon-btn.is-on svg{fill:currentColor}

/* 卡片 */
.card{
  background:var(--surface-base);
  border:var(--bw-1) solid var(--stroke-subtle);
  border-radius:var(--r-lg);
  padding:var(--sp-4);
  transition:background var(--tr-base),border-color var(--tr-base),box-shadow var(--tr-base),transform var(--tr-base);
}
.card:hover{background:var(--surface-raised);border-color:var(--stroke-strong);box-shadow:var(--elev-1)}
.card--pad-lg{padding:var(--sp-5)}
.card--interactive{cursor:pointer}
.card--interactive:hover{transform:translateY(-2px);box-shadow:var(--glow-resonance),var(--elev-1)}
.card--interactive:active{transform:translateY(0) scale(.995)}
.card--flat:hover{background:var(--surface-base);border-color:var(--stroke-subtle);box-shadow:none}

/* 标签 / 芯片 */
.tag{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:var(--sp-0h) var(--sp-2);
  border-radius:var(--r-pill);
  border:var(--bw-1) solid var(--stroke-base);
  background:var(--surface-sunken);color:var(--text-muted);
  font-size:var(--fs-micro);letter-spacing:var(--ls-caps);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.tag--accent{color:var(--resonance);border-color:var(--stroke-accent);background:var(--resonance-glow)}
.tag--hot{color:var(--wail-red);border-color:var(--wail-red);background:var(--wail-glow)}
.tag--gold{color:var(--tide-gold);border-color:var(--tide-gold);background:var(--surface-sunken)}
.tag--elem{color:var(--el,var(--resonance));border-color:var(--el,var(--stroke-base));background:var(--surface-sunken)}
.tag__dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);background:currentColor;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{
  display:inline-flex;align-items:center;gap:var(--sp-1h);
  padding:var(--sp-1h) var(--sp-3);
  border-radius:var(--r-pill);
  border:var(--bw-1) solid var(--stroke-subtle);
  background:var(--surface-sunken);color:var(--text-muted);
  font-size:var(--fs-caption);cursor:pointer;
  transition:color var(--tr-fast),border-color var(--tr-fast),background var(--tr-fast),transform var(--dur-fast) var(--ease-out);
}
.chip:hover{border-color:var(--stroke-strong);color:var(--text-body);background:var(--surface-base)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"],.chip.active{
  color:var(--resonance);border-color:var(--stroke-accent);background:var(--resonance-glow);
}
.chip:disabled{opacity:var(--disabled-op);cursor:not-allowed}

/* 输入 */
.field{display:flex;flex-direction:column;gap:var(--sp-1h)}
.field__label{font-size:var(--fs-caption);color:var(--text-muted);letter-spacing:var(--ls-caps)}
.input{
  width:100%;padding:var(--sp-2h) var(--sp-3);
  border-radius:var(--r-sm);
  border:var(--bw-1) solid var(--stroke-base);
  background:var(--surface-sunken);color:var(--text-high);
  transition:border-color var(--tr-fast),box-shadow var(--tr-fast),background var(--tr-fast);
}
.input::placeholder{color:var(--text-faint)}
.input:hover{border-color:var(--stroke-strong)}
.input:focus{outline:none;border-color:var(--stroke-accent);box-shadow:var(--focus-ring)}
.input.error{border-color:var(--wail-red);box-shadow:var(--focus-ring-error)}
.input:disabled{opacity:var(--disabled-op);cursor:not-allowed}
textarea.input{min-height:calc(var(--sp-8) + var(--sp-5));resize:vertical;line-height:var(--lh-base)}
.field__err{color:var(--wail-red);font-size:var(--fs-micro);display:flex;align-items:center;gap:var(--sp-1)}
.field__hint{color:var(--text-faint);font-size:var(--fs-micro)}
.search{position:relative;flex:1 1 var(--search-min);min-width:0}
.search .input{padding-inline-start:calc(var(--icon) + var(--sp-4))}
.search__icon{position:absolute;inset-inline-start:var(--sp-3);top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}

/* 空态：虚线描边 + 顶部径向青光 + 三段式 */
.empty{
  display:grid;justify-items:center;gap:var(--sp-3);
  padding:var(--sp-7) var(--sp-4);
  text-align:center;
  border:var(--bw-1) dashed var(--stroke-strong);
  border-radius:var(--r-lg);
  background-image:var(--glow-top);
  background-color:var(--surface-sunken);
}
.empty__art{color:var(--stroke-strong)}
.empty__art svg{width:calc(var(--sp-8) + var(--sp-5));height:calc(var(--sp-8) + var(--sp-5))}
.empty__title{color:var(--text-high);font-size:var(--fs-h3)}
.empty__text{color:var(--text-muted);font-size:var(--fs-caption);max-width:var(--max-prose)}

/* 骨架屏：200% 宽度 shimmer 扫光 */
.skeleton{
  border-radius:var(--r-md);
  background-image:var(--skel);
  background-size:var(--shimmer-w) 100%;
  background-repeat:no-repeat;
  animation:shimmer var(--shimmer-dur) linear infinite;
}
.skeleton--line{height:var(--sp-3)}
.skeleton--line-2{width:72%}
.skeleton--title{height:var(--sp-4h);width:60%}
.skeleton--card{height:calc(var(--sp-8) * 2);border-radius:var(--r-lg)}
@keyframes shimmer{from{background-position:var(--shimmer-w) 0}to{background-position:calc(-1 * var(--shimmer-w)) 0}}

/* 进度 / 评分 */
.bar{height:var(--bar-h);border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.bar__fill{
  height:100%;width:0;border-radius:var(--r-pill);background:var(--grad-bar);
  transition:width var(--dur-slow) var(--ease-out);
}
.is-in .bar__fill{width:calc(var(--v,0) * 1%)}
.metric{display:grid;gap:var(--sp-1h)}
.metric__top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);font-size:var(--fs-caption)}
.metric__label{color:var(--text-muted)}
.metric__value{color:var(--text-high);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.metrics{display:grid;gap:var(--sp-3h);grid-template-columns:repeat(auto-fit,minmax(min(var(--metric-min),100%),1fr))}
.stat{display:grid;gap:var(--sp-0h)}
.stat__value{font-size:var(--fs-xl);color:var(--text-high);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.stat__label{font-size:var(--fs-micro);color:var(--text-muted);letter-spacing:var(--ls-caps)}

/* 头像 */
.avatar{
  display:grid;place-items:center;flex:0 0 auto;
  width:var(--avatar);height:var(--avatar);border-radius:var(--r-pill);
  background:linear-gradient(140deg,var(--el,var(--resonance)),transparent 78%),var(--surface-raised);
  border:var(--bw-1) solid var(--stroke-base);
  color:var(--text-high);font-weight:600;font-size:var(--fs-h3);
  box-shadow:var(--shadow-inset);
}
.avatar--sm{width:var(--avatar-sm);height:var(--avatar-sm);font-size:var(--fs-caption)}
.avatar--lg{width:var(--avatar-lg);height:var(--avatar-lg);font-size:var(--fs-h1)}

/* 品牌签名 01：声波频谱 */
.wave{
  display:flex;align-items:flex-end;gap:var(--wave-gap);
  height:var(--wave-h);padding:var(--sp-4) var(--sp-4) 0;
  mask-image:linear-gradient(90deg,transparent,var(--mask-solid) 12%,var(--mask-solid) 88%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--mask-solid) 12%,var(--mask-solid) 88%,transparent);
}
.wave i{
  flex:1 1 0;min-width:0;height:100%;
  transform-origin:bottom center;
  transform:scaleY(var(--h,.4));
  border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--wave-from),var(--wave-to));
  opacity:var(--wave-op);
  animation:wave-pulse var(--wave-dur) var(--ease-out) infinite alternate;
  animation-delay:calc(var(--i,0) * var(--wave-delay) * -1);
}
@keyframes wave-pulse{
  from{transform:scaleY(calc(var(--h,.4) * .42));opacity:calc(var(--wave-op) * .55)}
  to{transform:scaleY(var(--h,.4));opacity:var(--wave-op)}
}

/* 品牌签名 02：共鸣环 */
.is-resonating{animation:resonance-ring var(--dur-slow) var(--ease-out) 1}
@keyframes resonance-ring{
  from{box-shadow:0 0 0 0 var(--stroke-accent)}
  to{box-shadow:0 0 0 var(--ring-spread) var(--ring-transparent)}
}

/* --------------------------------------------------------------- 05 VIEWS */

/* Hero */
.hero{position:relative;overflow:hidden;border-bottom:var(--bw-1) solid var(--stroke-subtle)}
.hero__inner{
  max-width:var(--content);margin:0 auto;
  padding:var(--sp-8) var(--sp-4) var(--sp-6);
  display:grid;gap:var(--sp-4);justify-items:start;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-1) var(--sp-3);border-radius:var(--r-pill);
  border:var(--bw-1) solid var(--stroke-accent);background:var(--resonance-glow);
  color:var(--resonance);font-size:var(--fs-caption);
}
.hero__title{font-size:var(--fs-display);letter-spacing:var(--ls-tight)}
.grad{background:var(--grad-primary);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero__lede{color:var(--text-body);font-size:var(--fs-lg);max-width:var(--max-prose)}
.hero__cta{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-1)}
.hero__stats{
  display:grid;gap:var(--sp-4) var(--sp-6);margin-top:var(--sp-3);
  grid-template-columns:repeat(auto-fit,minmax(min(var(--stat-min),100%),1fr));
  padding-top:var(--sp-4);border-top:var(--bw-1) solid var(--stroke-subtle);width:100%;
}
/* DOM 顺序保持 dt → dd（合法结构），视觉上数值在上 */
.hero__stats .stat{display:flex;flex-direction:column-reverse}

/* 功能模块卡 */
.feature{display:grid;gap:var(--sp-2h);align-content:start;position:relative}
.feature__icon{
  display:grid;place-items:center;width:calc(var(--icon-lg) + var(--sp-5));height:calc(var(--icon-lg) + var(--sp-5));
  border-radius:var(--r-md);color:var(--resonance);
  background:var(--surface-sunken);border:var(--bw-1) solid var(--stroke-base);
}
.feature__title{font-size:var(--fs-h3);display:flex;align-items:center;gap:var(--sp-1h)}
.feature__desc{font-size:var(--fs-caption);color:var(--text-muted)}
.feature__go{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-caption);color:var(--text-faint)}
.card--interactive:hover .feature__go{color:var(--resonance)}

/* 资讯 */
.news{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp-4);align-items:start}
.news__date{
  display:grid;justify-items:center;gap:var(--sp-0h);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);
  background:var(--surface-sunken);border:var(--bw-1) solid var(--stroke-subtle);
  min-width:calc(var(--sp-8) + var(--sp-2));
}
.news__date b{font-size:var(--fs-xl);color:var(--text-high);line-height:1}
.news__date span{font-size:var(--fs-micro);color:var(--text-muted)}
.news__main{display:grid;gap:var(--sp-1h)}
.news__tags{display:flex;gap:var(--sp-1h);align-items:center;flex-wrap:wrap}
.news__title{font-size:var(--fs-h3)}
.news__excerpt{font-size:var(--fs-caption);color:var(--text-muted);overflow-wrap:anywhere}
.news__meta{display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-micro);color:var(--text-faint)}
.news__arrow{color:var(--text-faint);align-self:center;transition:color var(--tr-fast),transform var(--tr-base)}
.card--interactive:hover .news__arrow{color:var(--resonance);transform:translateX(var(--sp-1))}

/* 日历 */
.cal__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-3)}
.cal__month{font-size:var(--fs-h2);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.cal__nav{display:flex;gap:var(--sp-2)}
.cal__grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--sp-1h)}
.cal__dow{
  text-align:center;font-size:var(--fs-micro);color:var(--text-muted);
  letter-spacing:var(--ls-caps);padding-bottom:var(--sp-1);
}
.cal__cell{min-height:var(--cell-h)}
.cal__day{
  width:100%;height:100%;min-height:var(--cell-h);
  display:grid;align-content:start;gap:var(--sp-1);justify-items:start;
  padding:var(--sp-1h);border-radius:var(--r-md);cursor:pointer;
  border:var(--bw-1) solid var(--stroke-subtle);background:var(--surface-sunken);
  color:var(--text-body);text-align:start;
  transition:background var(--tr-fast),border-color var(--tr-fast),transform var(--dur-fast) var(--ease-out);
}
.cal__day:hover{background:var(--surface-base);border-color:var(--stroke-strong)}
.cal__day:active{transform:scale(.98)}
.cal__day.is-weekend .cal__num{color:var(--text-muted)}
.cal__day.has-event{border-color:var(--stroke-accent)}
.cal__day[aria-pressed="true"],.cal__day.is-selected{background:var(--surface-raised);border-color:var(--resonance);box-shadow:var(--glow-resonance)}
.cal__day.is-today .cal__num{color:var(--tide-gold)}
.cal__num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-caption);color:var(--text-high)}
.cal__dots{display:flex;gap:var(--sp-0h);flex-wrap:wrap}
.cal__dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);background:var(--resonance)}
.cal__dot--活动{background:var(--tide-gold)} .cal__dot--攻略{background:var(--sonic)}
.cal__dot--同人{background:var(--elem-havoc)} .cal__dot--公告{background:var(--resonance)}
.cal__day-all{font-size:var(--fs-micro);color:var(--text-faint)}
.sched{display:grid;gap:var(--sp-2h)}
.sched__item{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;
  padding:var(--sp-2h) var(--sp-3);border-radius:var(--r-md);
  background:var(--surface-sunken);border:var(--bw-1) solid var(--stroke-subtle);
  transition:border-color var(--tr-fast),background var(--tr-fast);
}
.sched__item:hover{border-color:var(--stroke-strong);background:var(--surface-base)}
.sched__time{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--resonance);font-size:var(--fs-caption)}
.sched__title{color:var(--text-high);font-size:var(--fs-sm);overflow-wrap:anywhere}
.sched__date-title{font-size:var(--fs-h3);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}

/* 图鉴 */
.toolbar{display:grid;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-lg);
  background:var(--surface-base);border:var(--bw-1) solid var(--stroke-subtle);margin-bottom:var(--sp-4)}
.toolbar__row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.toolbar__label{font-size:var(--fs-micro);color:var(--text-faint);letter-spacing:var(--ls-caps);min-width:calc(var(--sp-8) - var(--sp-2))}
.echo{display:grid;gap:var(--sp-2h);align-content:start;--el:var(--resonance)}
.echo__top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.echo__art{
  display:grid;place-items:center;height:calc(var(--sp-8) + var(--sp-6));
  border-radius:var(--r-md);
  background:radial-gradient(70% 90% at 50% 104%,var(--el),transparent 72%),var(--surface-sunken);
  border:var(--bw-1) solid var(--stroke-subtle);
}
.echo__initial{font-size:var(--fs-2xl);color:var(--text-high);font-weight:600;opacity:.9}
.echo__name{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);font-size:var(--fs-h3)}
.echo__set{font-size:var(--fs-micro);color:var(--tide-gold);letter-spacing:var(--ls-caps)}
.echo__skill{font-size:var(--fs-caption);color:var(--text-muted);overflow-wrap:anywhere}
.echo__foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);
  padding-top:var(--sp-2);border-top:var(--bw-1) solid var(--stroke-subtle);font-size:var(--fs-caption);color:var(--tide-gold)}
.cost{
  font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-micro);
  padding:var(--sp-0h) var(--sp-2);border-radius:var(--r-xs);
  border:var(--bw-1) solid var(--stroke-accent);background:var(--resonance-glow);color:var(--resonance);
}
.detail-grid{display:grid;gap:var(--sp-2h);grid-template-columns:repeat(auto-fit,minmax(min(var(--detail-min),100%),1fr));margin:var(--sp-3) 0}
.detail-grid .stat{background:var(--surface-sunken);border:var(--bw-1) solid var(--stroke-subtle);border-radius:var(--r-md);padding:var(--sp-2h)}
.detail-grid .stat__value{font-size:var(--fs-lg)}

/* 配队 */
.slots{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(min(var(--slot-min),100%),1fr))}
.slot{position:relative;border-radius:var(--r-lg)}
.slot__pick{
  width:100%;display:grid;gap:var(--sp-2);justify-items:center;align-content:start;
  padding:var(--sp-5) var(--sp-3);
  border-radius:var(--r-lg);cursor:pointer;
  border:var(--bw-1) dashed var(--stroke-strong);
  background:var(--surface-sunken);color:var(--text-muted);
  transition:border-color var(--tr-base),background var(--tr-base),transform var(--tr-base),color var(--tr-fast);
}
.slot__pick:hover{border-color:var(--stroke-accent);background:var(--surface-base);color:var(--resonance)}
.slot__pick:active{transform:scale(.985)}
.slot__pick:disabled{opacity:var(--disabled-op);cursor:not-allowed}
.slot.is-filled .slot__pick{
  border-style:solid;border-color:var(--stroke-base);color:var(--text-body);
  background:radial-gradient(90% 70% at 50% 0,var(--resonance-glow),transparent 70%),var(--surface-base);
}
.slot.is-filled .slot__pick:hover{border-color:var(--el,var(--stroke-accent))}
.slot__badge{
  position:absolute;inset-block-start:var(--sp-2);inset-inline-start:var(--sp-3);
  font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:var(--fs-micro);color:var(--text-faint);letter-spacing:var(--ls-caps);
}
.slot__name{font-size:var(--fs-h3);color:var(--text-high)}
.slot__role{font-size:var(--fs-micro);color:var(--text-muted);letter-spacing:var(--ls-caps)}
.slot__plus{
  display:grid;place-items:center;width:var(--avatar);height:var(--avatar);
  border-radius:var(--r-pill);border:var(--bw-1) dashed var(--stroke-strong);color:inherit;
}
.slot__clear{position:absolute;inset-block-start:var(--sp-2);inset-inline-end:var(--sp-2)}
.ring-wrap{display:grid;justify-items:center;gap:var(--sp-2)}
.ring{width:calc(var(--sp-8) + var(--sp-8));height:calc(var(--sp-8) + var(--sp-8));max-width:100%}
.ring__track{fill:none;stroke:var(--track);stroke-width:10}
.ring__bar{
  fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;
  transition:stroke-dashoffset var(--tr-slow);
}
.ring__stop-a{stop-color:var(--resonance)} .ring__stop-b{stop-color:var(--sonic)}
.ring__center{display:grid;justify-items:center;margin-top:calc(-1 * (var(--sp-8) + var(--sp-5)))}
.ring__score{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-2xl);color:var(--text-high);line-height:1.1}
.ring__unit{font-size:var(--fs-micro);color:var(--text-muted);letter-spacing:var(--ls-caps)}
.verdict{font-size:var(--fs-caption);color:var(--resonance)}
.hint-list{display:grid;gap:var(--sp-2)}
.hint-list li{display:flex;gap:var(--sp-2);font-size:var(--fs-caption);color:var(--text-muted);align-items:flex-start}
.hint-list svg{margin-top:var(--sp-0h);color:var(--resonance)}
.pick{
  display:grid;gap:var(--sp-1h);justify-items:center;text-align:center;
  padding:var(--sp-3h) var(--sp-2);border-radius:var(--r-md);cursor:pointer;
  border:var(--bw-1) solid var(--stroke-subtle);background:var(--surface-base);
  transition:border-color var(--tr-fast),background var(--tr-fast),transform var(--tr-fast);
}
.pick:hover{border-color:var(--el,var(--stroke-accent));background:var(--surface-raised);transform:translateY(-2px)}
.pick:active{transform:translateY(0) scale(.985)}
.pick:disabled{opacity:var(--disabled-op);cursor:not-allowed;transform:none}
.pick__name{color:var(--text-high);font-size:var(--fs-caption)}
.pick__meta{font-size:var(--fs-micro);color:var(--text-muted)}

/* 社区 */
.bbs-form{display:grid;gap:var(--sp-3)}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}
.counter{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-micro);color:var(--text-faint)}
.counter.is-over{color:var(--wail-red)}
.post{display:grid;gap:var(--sp-2h)}
.post__head{display:flex;align-items:center;gap:var(--sp-2h)}
.post__who{display:grid;line-height:1.3;flex:1 1 auto}
.post__name{color:var(--text-high);font-size:var(--fs-caption)}
.post__meta{font-size:var(--fs-micro);color:var(--text-faint);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.post__title{font-size:var(--fs-h3)}
.post__body{font-size:var(--fs-body);color:var(--text-body);overflow-wrap:anywhere;white-space:pre-wrap}
.post__acts{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;
  padding-top:var(--sp-2h);border-top:var(--bw-1) solid var(--stroke-subtle)}
.post__acts .btn.is-on{color:var(--wail-red);border-color:var(--wail-red);background:var(--wail-glow)}
.post__acts .btn.is-on svg{fill:currentColor}
.bbs-list{display:grid;gap:var(--sp-3)}

/* 个人中心 */
.profile{display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap;
  background:radial-gradient(90% 160% at 0 0,var(--resonance-glow),transparent 62%),var(--surface-base)}
.profile__id{display:grid;gap:var(--sp-0h);flex:1 1 var(--profile-min)}
.profile__name{font-size:var(--fs-h1)}
.profile__uid{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-micro);color:var(--text-muted);letter-spacing:var(--ls-caps)}
.profile__tags{display:flex;gap:var(--sp-1h);flex-wrap:wrap;margin-top:var(--sp-1h)}
.fav-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;
  padding:var(--sp-2h) var(--sp-3);border-radius:var(--r-md);
  background:var(--surface-sunken);border:var(--bw-1) solid var(--stroke-subtle)}
.fav-item__name{color:var(--text-high);font-size:var(--fs-sm);overflow-wrap:anywhere}
.fav-item__meta{font-size:var(--fs-micro);color:var(--text-muted)}
.chip-mark{display:grid;place-items:center;width:var(--avatar-sm);height:var(--avatar-sm);border-radius:var(--r-sm);
  background:var(--surface-raised);border:var(--bw-1) solid var(--stroke-base);color:var(--el,var(--resonance))}

/* CTA 条 */
.cta-band{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;
  padding:var(--sp-5);border-radius:var(--r-xl);
  border:var(--bw-1) solid var(--stroke-accent);
  background:radial-gradient(120% 160% at 100% 0,var(--resonance-glow),transparent 60%),var(--surface-base);
}
.cta-band__text{display:grid;gap:var(--sp-1)}

/* ------------------------------------------- 05b 视觉增强层（质感 / 光效 / 入场） */

/* 卡片：顶部发丝高光；导航型卡片附悬停扫光与科技角标 */
.card{position:relative}
.card::before{
  content:"";position:absolute;inset-block-start:0;inset-inline:14%;
  height:var(--bw-1);background:var(--hairline);opacity:.6;pointer-events:none;
}
.card--interactive{overflow:hidden}
.card--interactive::after{
  content:"";position:absolute;inset-block-start:var(--sp-2h);inset-inline-end:var(--sp-2h);
  width:var(--corner-size);height:var(--corner-size);pointer-events:none;
  border-block-start:var(--corner-w) solid var(--resonance);
  border-inline-end:var(--corner-w) solid var(--resonance);
  border-start-end-radius:var(--r-xs);
  opacity:0;transform:translate(calc(-1 * var(--sp-1)),var(--sp-1));
  transition:opacity var(--tr-base),transform var(--tr-base);
}
.card--interactive:hover::after,.card--interactive:focus-visible::after{opacity:1;transform:translate(0,0)}
.card--interactive:hover{
  background-image:var(--sheen);background-size:var(--sheen-w) 100%;background-repeat:no-repeat;
  background-position:200% 0; /* 静止时把高光带推出可视区，避免扫光结束后残留 */
  animation:sheen-sweep var(--dur-slow) var(--ease-out) 1;
}
@keyframes sheen-sweep{from{background-position:150% 0}to{background-position:-70% 0}}

/* 主按钮：内高光 + 外发光，悬停时点亮 */
.btn-primary{box-shadow:var(--shadow-inset),var(--halo-soft)}
.btn-primary:hover{box-shadow:var(--shadow-inset),var(--glow-resonance)}

/* 导航：底部渐变扫描线，当前项发光 */
.nav::after{
  content:"";position:absolute;inset-inline:0;inset-block-end:0;height:var(--bw-1);
  background:var(--hairline-accent);opacity:.45;pointer-events:none;
}
.nav__links a[aria-current="page"]{box-shadow:var(--halo-soft)}
.nav__inner{position:relative}

/* Hero 背景：双光斑 + 共鸣环 */
.hero{isolation:isolate}
.hero__bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{
  position:absolute;width:var(--orb-size);height:var(--orb-size);border-radius:var(--r-pill);
  filter:blur(var(--orb-blur));opacity:var(--orb-op);
  animation:orb-float var(--orb-dur) var(--ease-out) infinite alternate;
}
.orb--a{inset-block-start:calc(-1 * var(--sp-8));inset-inline-end:5%;background:var(--orb-1)}
.orb--b{inset-block-end:calc(-1 * var(--sp-7));inset-inline-start:-9%;background:var(--orb-2);
  animation-delay:calc(-0.5 * var(--orb-dur))}
@keyframes orb-float{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(0,var(--orb-travel),0) scale(1.1)}
}
.hero__rings{
  position:absolute;inset-block-start:46%;inset-inline-end:3%;
  width:min(var(--rings-w),62vw);height:auto;
  transform:translateY(-50%);color:var(--stroke-accent);opacity:.5;
}
.hero__rings circle{fill:none;stroke:currentColor;stroke-width:var(--bw-1)}
.hero__rings .r-pulse{transform-origin:center;animation:ring-pulse var(--ring-dur) var(--ease-out) infinite}
@keyframes ring-pulse{
  0%,100%{opacity:.18;transform:scale(.96)}
  50%{opacity:.62;transform:scale(1.03)}
}
/* 版本徽标的呼吸点 */
.dot-pulse{
  width:var(--dot);height:var(--dot);border-radius:var(--r-pill);background:var(--resonance);
  animation:dot-pulse var(--dot-dur) var(--ease-out) infinite;
}
@keyframes dot-pulse{
  0%{box-shadow:0 0 0 0 var(--stroke-accent)}
  70%{box-shadow:0 0 0 var(--sp-2) var(--ring-transparent)}
  100%{box-shadow:0 0 0 0 var(--ring-transparent)}
}
/* Hero 数据分栏 */
.hero__stats .stat{position:relative;padding-inline-start:var(--sp-4)}
.hero__stats .stat::before{
  content:"";position:absolute;inset-block:var(--sp-0h);inset-inline-start:0;
  width:var(--bw-1);background:var(--hairline-v);
}

/* 标题：序号芯片 + 页头分隔线 */
.section__index{
  font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-micro);
  letter-spacing:var(--ls-caps);color:var(--resonance);line-height:1;
  padding:var(--sp-0h) var(--sp-1h);border-radius:var(--r-xs);
  border:var(--bw-1) solid var(--stroke-accent);background:var(--resonance-glow);
}
.page-head{padding-bottom:var(--sp-4);border-bottom:var(--bw-1) solid var(--stroke-subtle)}
.page-head__kicker{
  font-family:var(--font-num);font-size:var(--fs-micro);letter-spacing:var(--ls-caps);
  color:var(--text-faint);margin-bottom:var(--sp-1);
}

/* 整页渲染时的入场动画（局部刷新不触发，避免筛选时反复播放） */
@keyframes enter-up{from{opacity:0;transform:translateY(var(--enter-y))}to{opacity:1;transform:none}}
.is-entering .grid>*,
.is-entering .stack>*,
.is-entering .bbs-list>*,
.is-entering .hero__inner>*,
.is-entering .slots>*,
.is-entering .cal__cell{
  animation:enter-up var(--enter-dur) var(--ease-out) backwards;
  animation-delay:calc(var(--i,0) * var(--enter-step));
}

/* 声骸卡：元素光环 + 核心旋转符环 + 评级条 */
.echo:hover{border-color:var(--el,var(--stroke-accent))}
.echo__art{position:relative;background-image:var(--aura-element),none}
.echo__art::before{
  content:"";position:absolute;
  inset-block-start:50%;inset-inline-start:50%;transform:translate(-50%,-50%);
  width:var(--rune-size);height:var(--rune-size);
  border-radius:var(--r-pill);border:var(--bw-1) dashed var(--el,var(--resonance));opacity:.34;
  animation:spin var(--spin-dur) linear infinite;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
.rating{display:flex;align-items:center;gap:var(--sp-2);width:100%}
.rating__track{
  position:relative;flex:1 1 auto;height:var(--sp-1);border-radius:var(--r-pill);
  background:var(--track);overflow:hidden;
}
.rating__fill{
  display:block;height:100%;width:calc(var(--v,0) * 1%);
  border-radius:var(--r-pill);background:var(--grad-bar);
}
.rating__value{
  font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:var(--fs-caption);color:var(--tide-gold);
}

/* 评分环：刻度底环 + 发光 + 渐变数字 */
.ring__ticks{fill:none;stroke:var(--tick);stroke-width:var(--bw-2);stroke-dasharray:1 7}
.ring__bar{filter:drop-shadow(0 0 var(--sp-1h) var(--resonance-glow))}
.ring__score{
  background:var(--score-grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}

/* 能力雷达图 */
.radar{width:100%;max-width:var(--radar-max);height:auto;margin:0 auto}
.radar__grid{fill:none;stroke:var(--stroke-subtle)}
.radar__axis{stroke:var(--stroke-subtle)}
.radar__area{fill:var(--resonance-glow);stroke:var(--resonance);stroke-width:var(--bw-2)}
.radar__dot{fill:var(--resonance)}
.radar__label{fill:var(--text-muted);font-size:var(--radar-fs);font-family:var(--font-sans)}

/* 成就徽章 */
.badges{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(min(var(--badge-min),100%),1fr))}
.badge{
  display:grid;gap:var(--sp-1h);justify-items:center;text-align:center;
  padding:var(--sp-3);border-radius:var(--r-md);
  border:var(--bw-1) solid var(--stroke-subtle);background:var(--surface-sunken);
  transition:border-color var(--tr-base),background var(--tr-base),box-shadow var(--tr-base),transform var(--tr-base);
}
.badge:hover{border-color:var(--stroke-accent);background:var(--surface-base);box-shadow:var(--elev-1);transform:translateY(-2px)}
.badge__icon{
  display:grid;place-items:center;
  width:calc(var(--icon-lg) + var(--sp-4));height:calc(var(--icon-lg) + var(--sp-4));
  border-radius:var(--r-pill);
  border:var(--bw-1) solid var(--stroke-accent);background:var(--resonance-glow);color:var(--resonance);
}
.badge__name{font-size:var(--fs-micro);color:var(--text-body);line-height:1.3}
.badge__note{font-size:var(--fs-micro);color:var(--text-faint);font-family:var(--font-num)}
.badge.is-locked{opacity:var(--disabled-op)}
.badge.is-locked .badge__icon{border-color:var(--stroke-base);background:var(--surface-sunken);color:var(--text-faint)}

/* 帖子：左侧分区色强调条 */
.post{position:relative;padding-inline-start:var(--sp-5)}
.post::before{
  content:"";position:absolute;inset-block:var(--sp-4);inset-inline-start:0;
  width:var(--bw-2);border-radius:var(--r-pill);background:var(--tag-color,var(--resonance));
}
.post--公告{--tag-color:var(--resonance)}
.post--活动{--tag-color:var(--tide-gold)}
.post--攻略{--tag-color:var(--sonic)}
.post--同人{--tag-color:var(--elem-havoc)}

/* 日历：有事件的日期顶部光条，选中项加强发光 */
.cal__day{position:relative;overflow:hidden}
.cal__day.has-event::before{
  content:"";position:absolute;inset-block-start:0;inset-inline:0;height:var(--bw-2);
  background:var(--grad-bar);opacity:.75;
}
.cal__day[aria-pressed="true"]{box-shadow:var(--glow-resonance),var(--elev-1)}

/* 浮层：模态与 Toast 的顶边高光 */
.modal::before{
  content:"";position:absolute;inset-block-start:0;inset-inline:16%;
  height:var(--bw-1);background:var(--hairline-accent);opacity:.7;pointer-events:none;
}
.modal{position:relative}
.toast{box-shadow:var(--elev-2),var(--halo-soft)}

/* 帖子元信息带图标；收藏项与提示列表的图标基线 */
.post__meta{display:inline-flex;align-items:center;gap:var(--sp-1)}
.post__meta .icon{width:var(--fs-micro);height:var(--fs-micro)}
.eyebrow .dot-pulse{flex:0 0 auto}
.hero__lede{position:relative}
/* 分区标题与页头在窄屏下换行更自然 */
@media (max-width:680px){
  .page-head__kicker{letter-spacing:var(--ls-caps)}
  .badge{padding:var(--sp-2h)}
}

/* --------------------------------------------------------------- 06 OVERLAY */
.modal-layer{
  position:fixed;inset:0;z-index:var(--z-modal);
  display:grid;place-items:center;padding:var(--sp-4);
}
.modal__scrim{position:absolute;inset:0;background:var(--scrim);animation:fade var(--dur-base) var(--ease-out)}
.modal{
  position:relative;width:min(var(--modal-w),100%);max-height:min(86dvh,var(--modal-h));overflow:auto;
  padding:var(--sp-5);border-radius:var(--r-xl);
  background:var(--surface-overlay);
  border:var(--bw-1) solid var(--stroke-base);
  box-shadow:var(--elev-2);
  animation:pop var(--dur-base) var(--ease-spring);
  overscroll-behavior:contain;
}
.modal--wide{width:min(var(--modal-w-wide),100%)}
.modal__head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.modal__title{font-size:var(--fs-h2)}
.modal__sub{font-size:var(--fs-micro);color:var(--text-muted);letter-spacing:var(--ls-caps);margin-top:var(--sp-0h)}
.modal__body{display:grid;gap:var(--sp-3)}
.modal__foot{display:flex;gap:var(--sp-2);justify-content:flex-end;flex-wrap:wrap;margin-top:var(--sp-4)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
body.is-locked{overflow:hidden}

.toast-layer{
  position:fixed;z-index:var(--z-toast);inset-block-end:var(--sp-4);inset-inline:0;
  display:grid;justify-items:center;gap:var(--sp-2);pointer-events:none;padding:0 var(--sp-4);
}
.toast{
  display:flex;align-items:center;gap:var(--sp-2);
  max-width:min(var(--toast-max),100%);
  padding:var(--sp-2h) var(--sp-4);border-radius:var(--r-pill);

  color:var(--text-high);font-size:var(--fs-caption);
  box-shadow:var(--elev-2);pointer-events:auto;

.toast svg{color:var(--resonance)}
.toast--warn{border-color:var(--wail-red)} .toast--warn svg{color:var(--wail-red)}
.toast.is-out{opacity:0;transform:translateY(var(--sp-2));transition:opacity var(--tr-base),transform var(--tr-base)}

var storageOK = (function(){
  try{
    var k = '__wuwa_probe__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    return true;
  }catch(err){ return false; }
})();
function loadState(){
  if(!storageOK) return;
  try{
    var raw = window.localStorage.getItem(STORE_KEY);
    if(!raw) return;
    var saved = JSON.parse(raw);
    PERSIST_FIELDS.forEach(function(k){
      if(saved[k] === undefined || saved[k] === null) return;
      if(k === 'posts'){ if(Array.isArray(saved[k]) && saved[k].length) state.posts = saved[k]; return; }
      if(k === 'team'){ if(Array.isArray(saved[k]) && saved[k].length === 3) state.team = saved[k]; return; }
      state[k] = saved[k];
    });
  }catch(err){ /* 数据损坏则回落默认值 */ }
}
function persist(){
  if(!storageOK) return;
  try{
    var payload = {};
    PERSIST_FIELDS.forEach(function(k){ payload[k] = state[k]; });
    window.localStorage.setItem(STORE_KEY, JSON.stringify(payload));
  }catch(err){ /* 配额或隐私模式：静默降级为内存态 */ }
}
function isFav(id){ return state.favorites.indexOf(id) > -1; }
function toggleFav(id){
  var i = state.favorites.indexOf(id);
  if(i > -1) state.favorites.splice(i,1); else state.favorites.unshift(id);
  persist();

function waveHTML(){
  var out = '';
  var bars = Math.max(8, Math.round(tokenMs('--bars', 40)));
  for(var i = 0; i < bars; i++){
    /* --i / --h 为数据驱动的振幅参数，不是设计令牌 */
    var h = 0.24 + 0.76 * Math.abs(Math.sin(i * 0.71)) * Math.abs(Math.cos(i * 0.23 + 1.1));

}

function monthLabel(ym){ var p = ym.split('-'); return p[0] + ' 年 ' + Number(p[1]) + ' 月'; }
function viewCalendar(s, u){
  var parts = u.calMonth.split('-');
  var y = Number(parts[0]), m = Number(parts[1]);
  var first = new Date(y, m - 1, 1);
  var lead = (first.getDay() + 6) % 7;              /* 周一为每周首日 */
  var total = new Date(y, m, 0).getDate();
  var todayISO = iso(new Date());
  var cells = [];
  var i;
  for(i = 0; i < lead; i++) cells.push('<div class="cal__cell" aria-hidden="true"></div>');
  for(i = 1; i <= total; i++){
    var dISO = y + '-' + pad2(m) + '-' + pad2(i);
    var evs = EVENTS[dISO] || [];
    var dow = new Date(y, m - 1, i).getDay();
    var cls = 'cal__day' + (evs.length ? ' has-event' : '') + (dow === 0 || dow === 6 ? ' is-weekend' : '') +
              (dISO === todayISO ? ' is-today' : '') + (dISO === u.calDay ? ' is-selected' : '');
    var dots = evs.slice(0,3).map(function(e){ return '<span class="cal__dot cal__dot--' + e.tag + '"></span>'; }).join('');
    var label = y + ' 年 ' + m + ' 月 ' + i + ' 日，' + (evs.length ? evs.length + ' 项日程' : '暂无日程');
    cells.push('<div class="cal__cell">' +
      '<button class="' + cls + '" type="button" data-act="cal-day" data-date="' + dISO + '"' +
      ' data-focus="day-' + dISO + '" aria-pressed="' + (dISO === u.calDay) + '"' +
      ' aria-label="' + label + '">' +
      '<span class="cal__num">' + i + '</span>' +
      '<span class="cal__dots">' + dots + '</span>' +
      (evs.length > 3 ? '<span class="cal__day-all">+' + (evs.length - 3) + '</span>' : '') +
      '</button></div>');
  }
  var tail = (7 - ((lead + total) % 7)) % 7;
  for(i = 0; i < tail; i++) cells.push('<div class="cal__cell" aria-hidden="true"></div>');

  var dows = ['一','二','三','四','五','六','日'].map(function(d){ return '<div class="cal__dow" aria-hidden="true">' + d + '</div>'; }).join('');
  var dayEvents = EVENTS[u.calDay] || [];
  var schedule = dayEvents.length
    ? '<div class="sched">' + dayEvents.map(function(e){
        return '<div class="sched__item">' +
          '<span class="sched__time num">' + e.time + '</span>' +
          '<span class="sched__title">' + esc(e.title) + '</span>' +
          tagHTML(e.tag) +
        '</div>';
      }).join('') + '</div>'
    : emptyBlock({title:'当日暂无日程', text:'这一天没有安排活动，可以安心刷声骸。',
        action:{act:'cal-jump', value:'2026-09-12', label:'跳到 9 月 12 日'}});

  var canPrev = u.calMonth > CAL_MIN, canNext = u.calMonth < CAL_MAX;
  return '<div class="wrap">' +
    pageHead({kicker:'CLUB · VERSION CALENDAR', title:'版本日历', desc:'2026 年 9 月活动月视图，点击任意日期查看当日日程安排。'}) +
    '<div class="split">' +
      '<section class="card card--pad-lg card--flat" aria-label="月视图">' +
        '<div class="cal__head">' +
          '<h2 class="cal__month num">' + monthLabel(u.calMonth) + '</h2>' +
          '<div class="cal__nav">' +
            '<button class="icon-btn" type="button" data-act="cal-prev"' + (canPrev ? '' : ' disabled') +
              ' aria-label="上一个月">' + icon('left') + '</button>' +
            '<button class="icon-btn" type="button" data-act="cal-today" aria-label="回到 2026 年 9 月">' + icon('refresh') + '</button>' +
            '<button class="icon-btn" type="button" data-act="cal-next"' + (canNext ? '' : ' disabled') +
              ' aria-label="下一个月">' + icon('right') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="cal__grid" role="group" aria-label="' + monthLabel(u.calMonth) + ' 日期选择">' + dows + cells.join('') + '</div>' +
      '</section>' +
      '<aside class="stack" aria-label="当日日程">' +
        '<div class="card card--pad-lg">' +
          '<h2 class="sched__date-title">' + esc(u.calDay) + '<span class="tag tag--accent">' + dayEvents.length + ' 项</span></h2>' +
          '<div class="mt-3">' + schedule + '</div>' +
        '</div>' +
        '<div class="card card--pad-lg">' +
          '<h3 class="section__title">本月要点</h3>' +
          '<ul class="hint-list mt-3">' +
            '<li>' + icon('check') + '<span>9 月 1 日 2.6 版本更新，主线第九章解锁。</span></li>' +
            '<li>' + icon('check') + '<span>9 月 5 日起声骸双倍掉落，持续一周。</span></li>' +
            '<li>' + icon('check') + '<span>9 月 25 日前瞻直播，兑换码有效期 24 小时。</span></li>' +
          '</ul>' +
        '</div>' +
      '</aside>' +
    '</div>' +
  '</div>';
}

/* ---- 配队模拟 ---- */
function synergy(team){
  var filled = team.filter(Boolean);
  var uniq = {}; filled.forEach(function(c){ uniq[c.element] = 1; });
  var uniqN = Object.keys(uniq).length;
  var elem = !filled.length ? 0 : (uniqN === 3 ? 100 : uniqN === 2 ? 72 : 42);
  var roles = {}; filled.forEach(function(c){ roles[c.role] = 1; });
  var role = 0;
  if(roles['主C']) role += 40;
  if(roles['副C']) role += 30;
  if(roles['辅助']) role += 30;
  if(roles['治疗']) role += 30;
  role = Math.min(100, role);
  var surv = !filled.length ? 0 : Math.min(100, (roles['治疗'] ? 58 : 0) + (roles['辅助'] ? 26 : 0) + (filled.length === 3 ? 16 : 0));
  var power = !filled.length ? 0 : Math.round(filled.reduce(function(a,c){ return a + c.power; }, 0) / filled.length);
  var total = !filled.length ? 0 : Math.round(elem * .3 + role * .3 + surv * .15 + power * .25);
  return {
    total: total,
    complete: filled.length === 3,
    filled: filled.length,

/* ---- 能力雷达（纯 SVG，无外部依赖） ---- */
function radarHTML(items){
  var cx = 112, cy = 106, R = 72, n = items.length, i;
  var pt = function(i, k){
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    return (cx + Math.cos(a) * R * k).toFixed(1) + ',' + (cy + Math.sin(a) * R * k).toFixed(1);
  };
  var grid = [0.25, 0.5, 0.75, 1].map(function(k){
    var pts = [];
    for(i = 0; i < n; i++) pts.push(pt(i, k));
    return '<polygon class="radar__grid" points="' + pts.join(' ') + '"/>';
  }).join('');
  var axes = items.map(function(it, k){ return '<line class="radar__axis" x1="' + cx + '" y1="' + cy + '" x2="' + pt(k,1).split(',')[0] + '" y2="' + pt(k,1).split(',')[1] + '"/>'; }).join('');
  var area = items.map(function(it, k){ return pt(k, Math.max(0.04, it.v / 100)); }).join(' ');
  var dots = items.map(function(it, k){
    var p = pt(k, Math.max(0.04, it.v / 100)).split(',');
    return '<circle class="radar__dot" cx="' + p[0] + '" cy="' + p[1] + '" r="2.6"/>';
  }).join('');
  var labels = items.map(function(it, k){
    var a = -Math.PI / 2 + k * 2 * Math.PI / n, r = R + 20;
    var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    var anchor = Math.abs(Math.cos(a)) < 0.25 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    return '<text class="radar__label" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '"' +
      ' text-anchor="' + anchor + '" dominant-baseline="middle">' + esc(it.label) + '</text>';
  }).join('');
  return '<svg class="radar" viewBox="0 0 224 212" role="img" aria-label="能力雷达图：' +
    esc(items.map(function(it){ return it.label + ' ' + it.v + ' 分'; }).join('，')) + '">' +
    grid + axes + '<polygon class="radar__area" points="' + area + '"/>' + dots + labels + '</svg>';
}

  /* 入场编排：为网格/列表子项编号，驱动逐条延迟；局部 patch 不触发 */
  var enterCap = tokenMs('--enter-cap', 10);
  $$('.grid>*,.stack>*,.bbs-list>*,.hero__inner>*,.slots>*,.cal__cell', appEl).forEach(function(el, i){
    el.style.setProperty('--i', Math.min(i, enterCap));
  });
  appEl.classList.add('is-entering');
  window.clearTimeout(enterTimer);
  enterTimer = window.setTimeout(function(){
    appEl.classList.remove('is-entering');
  }, tokenMs('--enter-dur', 520) + tokenMs('--enter-step', 60) * tokenMs('--enter-cap', 10) + 400);
  syncNav();
  restoreFocus();
  requestAnimationFrame(afterRender);
}
function patch(selector, html){
  var el = $(selector);
  if(el) el.innerHTML = html;
}
function syncNav(){
  $$('.nav__links a').forEach(function(a){
    if(a.dataset.route === ui.route) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  var nav = $('#nav');
  nav.classList.remove('is-open');
  var burger = $('.nav__burger');
  if(burger) burger.setAttribute('aria-expanded','false');
}
function restoreFocus(){
  if(!ui.focusKey) return;
  var el = document.querySelector('[data-focus="' + ui.focusKey + '"]');
  ui.focusKey = null;
  if(!el || el.disabled) return;
  el.focus();
}
function afterRender(){
  /* 进度条入场：加 .is-in 触发由 0 到目标宽度的过渡 */
  $$('.metric, .split, .wrap').forEach(function(el){ el.classList.add('is-in'); });
  /* 评分环形：由满周长过渡到目标偏移 */
  var ring = $('#ringBar');
  if(ring){
    var target = ring.getAttribute('data-target');
    requestAnimationFrame(function(){ ring.style.strokeDashoffset = target; });
  }
  /* 共鸣环：选中角色的槽位播放一次扩散 */
  if(ui.resonate !== null){
    var slot = document.querySelector('[data-slot="' + ui.resonate + '"]');
    ui.resonate = null;
    if(slot){ slot.classList.remove('is-resonating'); void slot.offsetWidth; slot.classList.add('is-resonating'); }
  }
}
function parseRoute(){
  var h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
  return h && views[h] ? h : 'home';
}
function onRouteChange(){
  var next = parseRoute();
  var changed = next !== ui.route;
  ui.route = next;
  if(changed) ui.focusKey = null;
  if(next === 'wiki') startWikiLoad();
  render();
  if(changed) window.scrollTo({top:0, behavior: reduced() ? 'auto' : 'smooth'});
}
/* 图鉴首次进入展示骨架屏（演示加载态），视图函数保持纯净 */
function startWikiLoad(){
  if(ui.wikiVisited) return;
  ui.wikiVisited = true;
  ui.loadingWiki = true;
  window.setTimeout(function(){
    ui.loadingWiki = false;
    if(ui.route === 'wiki') render();
  }, reduced() ? 0 : tokenMs('--skeleton-ms', 620));
}
window.addEventListener('hashchange', onRouteChange);

/* ==========================================================================
   6 · Toast / 模态（焦点陷阱 · ESC · 遮罩关闭）
   ========================================================================== */
function toast(message, tone){
  var el = document.createElement('div');
  el.className = 'toast' + (tone === 'warn' ? ' toast--warn' : '');
  el.innerHTML = icon(tone === 'warn' ? 'alert' : 'check') + '<span>' + esc(message) + '</span>';
  toastEl.appendChild(el);
  var life = tokenMs('--toast-dur', 2600);
  window.setTimeout(function(){
    el.classList.add('is-out');
    window.setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, reduced() ? 0 : tokenMs('--dur-base', 240));
  }, life);
}
var modalOpen = false;
function openModal(cfg){
  lastFocused = document.activeElement;
  modalEl.innerHTML =
    '<div class="modal__scrim" data-act="modal-close" aria-hidden="true"></div>' +
    '<div class="modal' + (cfg.wide ? ' modal--wide' : '') + '" role="dialog" aria-modal="true"' +
      ' aria-labelledby="modalTitle"' + (cfg.sub ? ' aria-describedby="modalSub"' : '') + '>' +
      '<div class="modal__head">' +
        '<div><h2 class="modal__title" id="modalTitle">' + cfg.title + '</h2>' +
        (cfg.sub ? '<p class="modal__sub" id="modalSub">' + esc(cfg.sub) + '</p>' : '') + '</div>' +
        '<button class="icon-btn" type="button" data-act="modal-close" aria-label="关闭对话框">' + icon('close') + '</button>' +
      '</div>' +
      '<div class="modal__body">' + cfg.body + '</div>' +
      (cfg.foot ? '<div class="modal__foot">' + cfg.foot + '</div>' : '') +
    '</div>';
  modalEl.hidden = false;
  document.body.classList.add('is-locked');
  modalOpen = true;
  requestAnimationFrame(function(){
    var focusables = modalFocusables();
    (focusables[0] || $('.modal', modalEl) || modalEl).focus();
  });
}
function closeModal(){
  if(!modalOpen) return;
  modalEl.hidden = true;
  modalEl.innerHTML = '';
  document.body.classList.remove('is-locked');
  modalOpen = false;
  if(lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}
function modalFocusables(){
  return $$('.modal a[href], .modal button:not([disabled]), .modal input:not([disabled]),' +
            ' .modal textarea:not([disabled]), .modal select:not([disabled]), .modal [tabindex]:not([tabindex="-1"])', modalEl);
}
document.addEventListener('keydown', function(e){
  if(modalOpen){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key === 'Tab'){
      var f = modalFocusables();
      if(!f.length) return;
      var first = f[0], last = f[f.length - 1], active = document.activeElement;
      if(e.shiftKey && (active === first || !modalEl.contains(active))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && active === last){ e.preventDefault(); first.focus(); }
      return;
    }
  }
  if(e.key === 'Enter' || e.key === ' '){
    var t = e.target.closest ? e.target.closest('[data-act][role="button"]') : null;
    if(t && e.target === t){ e.preventDefault(); t.click(); }
  }
});

/* ==========================================================================
   7 · 交互动作（事件委托）
   ========================================================================== */
function openNews(id){
  var n = NEWS_BY_ID[id];
  if(!n) return;
  var fav = isFav(n.id);
  openModal({
    sub:n.tag + ' · ' + n.date + ' · 阅读 ' + fmtInt(n.views),
    title:esc(n.title),
    body:'<div>' + n.body.map(function(p){ return '<p class="prose">' + esc(p) + '</p>'; }).join('') + '</div>',
    foot:'<button class="btn btn-sm" type="button" data-act="fav-toggle" data-id="' + n.id + '">' +
          (fav ? '取消收藏' : '收藏这篇资讯') + '</button>' +
         '<button class="btn btn-sm btn-primary" type="button" data-act="modal-close">知道了</button>'
  });
}
function openEcho(id){
  var e = ECHO_BY_ID[id];
  if(!e) return;
  var fav = isFav(e.id);
  openModal({
    sub:'COST ' + e.cost + ' · ' + elemLabel(e.element) + ' · ' + e.set,
    title:esc(e.name),
    body:'<div class="echo__art" style="--el:' + elemVar(e.element) + ';height:calc(var(--sp-8) + var(--sp-7))" aria-hidden="true">' +
           '<span class="echo__initial">' + esc(e.name.slice(0,1)) + '</span></div>' +
         '<div class="detail-grid">' +
           '<div class="stat"><span class="stat__value">' + e.cost + '</span><span class="stat__label">COST</span></div>' +
           '<div class="stat"><span class="stat__value">' + e.rating.toFixed(1) + '</span><span class="stat__label">共鸣评级</span></div>' +
           '<div class="stat"><span class="stat__value">' + elemLabel(e.element) + '</span><span class="stat__label">元素属性</span></div>' +
           '<div class="stat"><span class="stat__value">' + esc(e.set) + '</span><span class="stat__label">推荐套装</span></div>' +
         '</div>' +
         '<p class="prose">' + esc(e.skill) + '</p>' +
         '<p class="field__hint">数据来源：俱乐部图鉴收录，仅作演示用途。</p>',
    foot:'<button class="btn btn-sm" type="button" data-act="fav-toggle" data-id="' + e.id + '">' +
          (fav ? '取消收藏' : '加入收藏') + '</button>' +
         '<button class="btn btn-sm btn-primary" type="button" data-act="modal-close">关闭</button>'
  });
}
function openPicker(index){
  var used = {};
  state.team.forEach(function(id){ if(id) used[id] = 1; });
  var body = '<div class="grid">' + CHARS.map(function(c){
    var dis = !!used[c.id];
    return '<button class="pick" type="button" data-act="team-pick" data-id="' + c.id + '" data-index="' + index + '"' +
      ' style="--el:' + elemVar(c.element) + '"' + (dis ? ' disabled' : '') + '>' +
      '<span class="avatar" aria-hidden="true">' + esc(c.name.slice(0,1)) + '</span>' +
      '<span class="pick__name">' + esc(c.name) + '</span>' +
      '<span class="pick__meta">' + elemLabel(c.element) + ' · ' + esc(c.role) + '</span>' +
      (dis ? '<span class="tag">已上阵</span>' : '<span class="tag tag--elem" style="--el:' + elemVar(c.element) + '">强度 <span class="num">' + c.power + '</span></span>') +
    '</button>';
  }).join('') + '</div>';
  openModal({
    title:'选择角色 · SLOT ' + pad2(index + 1),
    sub:'已上阵的角色不可重复选择',
    wide:true,
    body:body
  });
}
function openRename(){
  openModal({
    title:'编辑昵称',
    sub:'昵称会显示在你发布的帖子上',
    body:'<div class="field">' +
        '<label class="field__label" for="renameInput">昵称</label>' +
        '<input class="input" id="renameInput" type="text" maxlength="16" value="' + esc(state.nickname) + '"' +
        ' aria-describedby="renameErr" placeholder="2 - 16 个字符">' +
        '<p class="field__err" id="renameErr" hidden>' + icon('alert') + '<span>昵称需要 2 - 16 个字符</span></p>' +
      '</div>',
    foot:'<button class="btn btn-sm" type="button" data-act="modal-close">取消</button>' +
         '<button class="btn btn-sm btn-primary" type="button" data-act="user-rename-save">保存昵称</button>'
  });
}

var actions = {
  /* 导航 */
  'nav-toggle':function(el){
    var nav = $('#nav');
    var open = nav.classList.toggle('is-open');
    el.setAttribute('aria-expanded', String(open));
  },

  /* 资讯 */
  'news-filter':function(el){
    ui.newsFilter = el.dataset.value;
    ui.focusKey = 'filter-' + ui.newsFilter;
    render();
  },
  'news-open':function(el){ openNews(el.dataset.id); },

  /* 日历 */
  'cal-day':function(el){
    ui.calDay = el.dataset.date;
    ui.focusKey = 'day-' + ui.calDay;
    render();
  },
  'cal-jump':function(el){
    ui.calDay = el.dataset.value;
    ui.calMonth = ui.calDay.slice(0,7);
    ui.focusKey = 'day-' + ui.calDay;
    render();
  },
  'cal-prev':function(){
    var p = ui.calMonth.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 2, 1);
    var ym = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    if(ym < CAL_MIN) return;
    ui.calMonth = ym; render();
  },
  'cal-next':function(){
    var p = ui.calMonth.split('-');
    var d = new Date(Number(p[0]), Number(p[1]), 1);
    var ym = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    if(ym > CAL_MAX) return;
    ui.calMonth = ym; render();
  },
  'cal-today':function(){ ui.calMonth = '2026-09'; ui.calDay = '2026-09-12'; render(); },

  /* 图鉴 */
  'wiki-cost':function(el){ ui.wikiCost = el.dataset.value; ui.focusKey = 'cost-' + ui.wikiCost; render(); },
  'wiki-elem':function(el){ ui.wikiElem = el.dataset.value; ui.focusKey = 'elem-' + ui.wikiElem; render(); },
  'wiki-reset':function(){
    ui.wikiQuery = ''; ui.wikiCost = 'all'; ui.wikiElem = 'all'; ui.focusKey = 'wiki-reset';
    render(); toast('筛选条件已重置');
  },
  'wiki-fav':function(el){
    toggleFav(el.dataset.id);
    ui.focusKey = 'fav-' + el.dataset.id;
    render();
    toast(isFav(el.dataset.id) ? '已加入收藏' : '已移出收藏');
  },
  'wiki-open':function(el){ openEcho(el.dataset.id); },

  /* 配队 */
  'team-slot':function(el){ openPicker(Number(el.dataset.index)); },
  'team-clear':function(el){
    var i = Number(el.dataset.index);
    state.team[i] = null; persist();
    ui.focusKey = 'slot-' + i;
    render(); toast('已移除该槽位角色');
  },
  'team-pick':function(el){
    var i = Number(el.dataset.index);
    state.team[i] = el.dataset.id;
    persist(); closeModal();
    ui.focusKey = 'slot-' + i;
    ui.resonate = i;
    render();
    toast(CHARS.filter(function(c){ return c.id === el.dataset.id; })[0].name + ' 已编入队伍');
  },
  'team-reset':function(){
    state.team = [null,null,null]; persist();
    ui.focusKey = 'team-reset';
    render(); toast('队伍已清空');
  },
  'team-share':function(el){
    if(el.disabled) return;
    var names = state.team.map(function(id){ return CHAR_BY_ID[id] ? CHAR_BY_ID[id].name : ''; }).join(' / ');
    toast('已生成分享文案：' + names + ' · 协同 ' + synergy(state.team.map(function(id){ return CHAR_BY_ID[id]; })).total + ' 分');
  },

  /* 社区 */
  'bbs-tag':function(el){ ui.bbsTag = el.dataset.value; ui.focusKey = 'bbstag-' + ui.bbsTag; render(); },
  'bbs-like':function(el){
    var id = el.dataset.id;
    if(state.likes[id]) delete state.likes[id]; else state.likes[id] = 1;
    persist();
    ui.focusKey = 'like-' + id;
    render();
  },
  'bbs-del':function(el){
    var id = el.dataset.id;
    state.posts = state.posts.filter(function(p){ return p.id !== id; });
    delete state.likes[id];
    persist(); render(); toast('帖子已删除');
  },
  'bbs-clearlikes':function(){
    state.likes = {}; persist(); render(); toast('点赞状态已重置');
  },
  'bbs-focus':function(){ var t = $('#bbsTitle'); if(t) t.focus(); },
  'bbs-reset':function(){
    var f = $('form[data-act="bbs-form"]');
    if(f) f.reset();
    var c = $('#bbsCount');
    if(c){ c.textContent = '0 / 400'; c.classList.remove('is-over'); }
    ['#bbsTitle','#bbsBody'].forEach(function(sel){
      var el = $(sel); if(el) el.classList.remove('error');
    });
    ['#bbsTitleErr','#bbsBodyErr'].forEach(function(sel){
      var el = $(sel); if(el) el.hidden = true;
    });
  },

  /* 个人中心 */
  'user-rename':function(){ openRename(); },
  'user-rename-save':function(){
    var input = $('#renameInput');
    var err = $('#renameErr');
    var v = (input.value || '').trim();
    if(v.length < 2 || v.length > 16){
      input.classList.add('error');
      input.setAttribute('aria-invalid','true');
      err.hidden = false;
      input.focus();
      return;
    }
    state.nickname = v;
    persist(); closeModal(); render();
    toast('昵称已更新为「' + v + '」');
  },
  'user-share':function(){ toast('主页链接已复制到剪贴板（演示）'); },
  'fav-toggle':function(el){
    toggleFav(el.dataset.id);
    closeModal(); render();
    toast(isFav(el.dataset.id) ? '已加入收藏' : '已移出收藏');
  },
  'fav-remove':function(el){
    toggleFav(el.dataset.id);
    ui.focusKey = 'favrm-' + el.dataset.id;
    render(); toast('已移出收藏');
  },
  'go-wiki':function(){ location.hash = '#/wiki'; },

  /* 模态 */
  'modal-close':function(){ closeModal(); }
};

document.addEventListener('click', function(e){
  var target = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!target){
    var nav = $('#nav');
    if(nav.classList.contains('is-open') && !e.target.closest('#nav')){
      nav.classList.remove('is-open');
      var b = $('.nav__burger');
      if(b) b.setAttribute('aria-expanded','false');
    }
    return;
  }
  var act = target.dataset.act;
  if(act === 'bbs-form' || act === 'bbs-submit') return; /* 由 submit 处理 */
  if(act === 'wiki-search') return;                      /* 由 input 处理 */
  if(!actions[act]) return;
  if(target.tagName === 'A') return;                     /* 链接交给路由 */
  e.preventDefault();
  actions[act](target, e);
});

/* 图鉴搜索：局部更新结果区，保留输入焦点与输入法组合状态 */
document.addEventListener('input', function(e){
  if(e.target.id === 'wikiSearch'){
    ui.wikiQuery = e.target.value;
    patch('#wikiGrid', wikiGridHTML(ui));
    var box = $('#wikiGrid');
    if(box){
      var n = wikiResults(ui).length;
      var c = $('#wikiCount');
      if(c) c.innerHTML = '共 <span class="num">' + n + '</span> 件声骸';
    }
    return;
  }
  if(e.target.id === 'bbsBody'){
    var len = e.target.value.length;
    var counter = $('#bbsCount');
    if(counter){
      counter.textContent = len + ' / 400';
      counter.classList.toggle('is-over', len > 380);
    }
    if(len >= 5){
      e.target.classList.remove('error');
      var err = $('#bbsBodyErr');
      if(err) err.hidden = true;
    }
  }
  if(e.target.id === 'bbsTitle' && e.target.value.trim().length >= 2){
    e.target.classList.remove('error');
    var tErr = $('#bbsTitleErr');
    if(tErr) tErr.hidden = true;
  }
});

/* 发帖表单：校验 → 写入状态 → 持久化 */
document.addEventListener('submit', function(e){
  var form = e.target;
  if(!form.dataset || form.dataset.act !== 'bbs-form') return;
  e.preventDefault();
  var titleEl = $('#bbsTitle'), bodyEl = $('#bbsBody');
  var title = (titleEl.value || '').trim();
  var body = (bodyEl.value || '').trim();
  var ok = true;
  if(title.length < 2){
    titleEl.classList.add('error');
    titleEl.setAttribute('aria-invalid','true');
    $('#bbsTitleErr').hidden = false;
    ok = false;
  }
  if(body.length < 5){
    bodyEl.classList.add('error');
    bodyEl.setAttribute('aria-invalid','true');
    $('#bbsBodyErr').hidden = false;
    ok = false;
  }
  if(!ok){
    toast('请先补全标题与正文', 'warn');
    (title.length < 2 ? titleEl : bodyEl).focus();
    return;
  }
  state.posts.push({
    id:'p' + Date.now().toString(36),
    author:state.nickname,
    tag:ui.bbsTag,
    likes:0,
    mine:true,
    ts:Date.now(),
    title:title,
    body:body
  });
  persist();
  render();
  toast('发布成功，帖子已保存到本地');
  window.scrollTo({top:0, behavior: reduced() ? 'auto' : 'smooth'});
});

/* ==========================================================================
   8 · 启动
   ========================================================================== */
loadState();
ui.route = parseRoute();
if(ui.route === 'wiki') startWikiLoad();
render();
window.setTimeout(function(){ toast('欢迎回到鸣潮粉丝俱乐部'); }, 420);
})();
</script>
